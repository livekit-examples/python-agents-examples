- file_path: avatars/hedra/dynamically_created_avatar/agent.py
  title: Dynamically Created Avatar
  category: avatars
  tags:
  - avatar
  - openai
  - deepgram
  difficulty: intermediate
  description: Shows how to create an avatar dynamically in an agent.
  demonstrates:
