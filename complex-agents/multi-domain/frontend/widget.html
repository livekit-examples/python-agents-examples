<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e293b;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1rem;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #64748b;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #ef4444;
      flex-shrink: 0;
    }
    .dot.connected { background: #22c55e; }
    .btn-row {
      display: flex;
      gap: 0.4rem;
    }
    #connectBtn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      border-radius: 0.4rem;
      background: #2563eb;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #connectBtn:hover { background: #1d4ed8; }
    #connectBtn.active {
      background: #dc2626;
    }
    #connectBtn.active:hover {
      background: #b91c1c;
    }
    #micBtn {
      display: none;
      padding: 0.6rem 0.75rem;
      border: none;
      border-radius: 0.4rem;
      background: #f59e0b;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #micBtn:hover { background: #d97706; }
    .user-id {
      font-size: 0.65rem;
      color: #475569;
      margin-top: 0.5rem;
      text-align: center;
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Voice Assistant</span>
    <div class="status-row">
      <div class="dot" id="statusDot"></div>
      <span id="status">Disconnected</span>
    </div>
  </div>
  <div class="btn-row">
    <button id="connectBtn">Connect</button>
    <button id="micBtn" title="Enable microphone">Unmute</button>
  </div>
  <div class="user-id" id="userId"></div>

  <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.js"></script>
  <script src="/shared.js"></script>
  <script>
    const dot = document.getElementById("statusDot");
    const btn = document.getElementById("connectBtn");
    const micBtn = document.getElementById("micBtn");
    const origUpdate = updateStatus;

    updateStatus = (s) => {
      origUpdate(s);
      const connected = s === "Connected";
      dot.classList.toggle("connected", connected);
      btn.textContent = connected ? "Disconnect" : "Connect";
      btn.classList.toggle("active", connected);

      // Show mic button if connected but mic is off
      if (connected && room && !room.localParticipant.isMicrophoneEnabled) {
        micBtn.style.display = "block";
      } else {
        micBtn.style.display = "none";
      }
    };

    micBtn.addEventListener("click", async () => {
      if (room) {
        await room.localParticipant.setMicrophoneEnabled(true);
        micBtn.style.display = "none";
      }
    });
  </script>
</body>
</html>
